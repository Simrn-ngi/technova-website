  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect With Us - TechNova</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background: #f8fafc;
      margin: 0;
    }

    .container {
      max-width: 400px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    nav {
      background: #0f172a;
      padding: 20px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 30px;
      font-weight: 500;
    }

    .cta-nav {
      background: #2563eb;
      padding: 8px 16px;
      border-radius: 6px;
    }

    .logo {
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .hamburger {
      display: none;
      cursor: pointer;
    }

    .hamburger div {
      width: 25px;
      height: 3px;
      background-color: white;
      margin: 5px 0;
    }

    @media (max-width: 768px) {
      nav {
        padding: 18px 20px;
      }

      .hamburger {
        display: block;
      }

      .nav-links {
        display: none;
        position: absolute;
        top: 65px;
        left: 0;
        background: #0f172a;
        width: 100%;
        flex-direction: column;
        align-items: center;
        z-index: 1000;
        padding: 20px 0;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }

      .nav-links.active {
        display: flex;
      }

      .nav-links a {
        margin: 15px 0;
      }

      .container {
        margin: 40px auto;
        padding: 20px;
        width: 90%;
      }
    }
  </style>
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-56GCPMQ5"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<nav>
  <div class="logo">TechNova</div>
  <div class="hamburger">
    <div></div>
    <div></div>
    <div></div>
  </div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="contact.html" class="cta-nav">Connect</a>
  </div>
</nav>

<div class="container">
  <h2>Connect With Us</h2>
  <form action="thankyou.html">
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <button type="submit">Submit</button>
  </form>
</div>

<script>
  const hamburger = document.querySelector('.hamburger');
  const navLinks = document.querySelector('.nav-links');

  hamburger.addEventListener('click', () => {
    navLinks.classList.toggle('active');
  });
</script>

</body>
</html>
