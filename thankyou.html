  <title>Thank You - TechNova</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
    }

    nav {
      background: #0f172a;
      padding: 20px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 30px;
      font-weight: 500;
    }

    .cta-nav {
      background: #2563eb;
      padding: 8px 16px;
      border-radius: 6px;
    }

    .logo {
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .hamburger {
      display: none;
      cursor: pointer;
    }

    .hamburger div {
      width: 25px;
      height: 3px;
      background-color: white;
      margin: 5px 0;
    }

    .thank-you-container {
      max-width: 600px;
      margin: 100px auto;
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .thank-you-container h1 {
      font-size: 32px;
      margin-bottom: 20px;
      color: #0f172a;
    }

    .thank-you-container p {
      font-size: 18px;
      margin-bottom: 30px;
      color: #333;
    }

    .thank-you-container a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      nav {
        padding: 18px 20px;
      }

      .hamburger {
        display: block;
      }

      .nav-links {
        display: none;
        position: absolute;
        top: 65px;
        left: 0;
        background: #0f172a;
        width: 100%;
        flex-direction: column;
        align-items: center;
        z-index: 1000;
        padding: 20px 0;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }

      .nav-links.active {
        display: flex;
      }

      .nav-links a {
        margin: 15px 0;
      }

      .thank-you-container {
        margin: 40px auto;
        padding: 20px;
        width: 90%;
      }
    }
